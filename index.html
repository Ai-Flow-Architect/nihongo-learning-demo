<!DOCTYPE html>
<html lang="ja">

<meta name="robots" content="noindex,nofollow">

<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#ffffff">
<title>Nihongo Step デモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light only;
    --bg: #ffffff;
    --bg-soft: #f5f7fc;
    --line: #e4e8f1;
    --text: #1f2433;
    --muted: #697089;
    --accent: #3d5bd9;
    --accent-soft: #e9eefd;
    --accent2: #ec5b7a;
    --accent2-soft: #fdeaef;
    --ok: #1f9d6a;
    --ok-soft: #e3f6ec;
    --ng: #d64545;
    --ng-soft: #fdeaea;
    --gold: #e0a100;
    --shadow: 0 8px 24px rgba(30, 45, 110, .08);
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #ffffff; color: var(--text); }
  body {
    font-family: "Noto Sans JP", system-ui, -apple-system, "Hiragino Sans", sans-serif;
    font-size: 15px; line-height: 1.6; min-height: 100vh;
  }
  /* PCでもスマホの枠で中央に出す */
  .stage { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #ffffff; }
  .phone { width: 100%; max-width: 390px; height: 100vh; height: 100dvh; background: var(--bg); position: relative; overflow: hidden; display: flex; flex-direction: column; }
  @media (min-width: 560px) {
    .stage { background: linear-gradient(180deg, #f8faff 0%, #eef2fc 100%); padding: 24px 16px; }
    .phone { height: 844px; max-height: calc(100vh - 48px); border-radius: 40px; border: 10px solid #1c2030; box-shadow: 0 30px 60px rgba(30, 45, 110, .22); }
    .phone::before { content: ""; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 110px; height: 26px; background: #1c2030; border-radius: 0 0 16px 16px; z-index: 50; }
  }
  .topbar { padding: 44px 16px 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--bg); border-bottom: 1px solid var(--line); flex: none; }
  .brand { font-weight: 700; font-size: 18px; letter-spacing: .03em; color: var(--accent); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .logo { width: 28px; height: 28px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; }
  .top-right { display: flex; gap: 6px; align-items: center; }
  .pill { border: 0; background: var(--accent-soft); color: var(--accent); font-weight: 700; padding: 5px 11px; border-radius: 999px; font-size: 13px; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .back { border: 0; background: transparent; color: var(--accent); font-weight: 500; font-size: 15px; cursor: pointer; padding: 4px 0; font-family: inherit; }
  .screens { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .screen { padding: 16px 16px 28px; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: none; } }
  h1 { font-size: 20px; margin: 4px 0 6px; font-weight: 700; }
  h2 { font-size: 16px; margin: 20px 0 8px; font-weight: 700; }
  p { margin: 6px 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .card { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); margin-bottom: 12px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 14px; padding: 13px 18px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; background: var(--accent); color: #fff; transition: transform .08s ease, opacity .2s; }
  .btn:active { transform: scale(.97); }
  .btn.full { width: 100%; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.pink { background: var(--accent2); }
  .btn.outline { background: #fff; color: var(--text); border: 1px solid var(--line); }
  .btn.danger { background: #fff; color: var(--ng); border: 1px solid #f1c9c9; }
  .btn.sm { padding: 8px 12px; font-size: 13px; border-radius: 10px; }
  .btn:disabled { opacity: .4; cursor: default; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .hero { text-align: center; padding: 28px 0 14px; }
  .hero .big { width: 84px; height: 84px; border-radius: 26px; margin: 0 auto 14px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-size: 40px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); }
  .hero h1 { font-size: 26px; color: var(--accent); letter-spacing: .04em; }
  input[type=text], textarea { width: 100%; font-family: inherit; font-size: 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--text); outline: none; }
  input[type=text]:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 14px; font-size: 14px; cursor: pointer; font-family: inherit; color: var(--text); }
  .progress { height: 8px; background: var(--bg-soft); border-radius: 999px; overflow: hidden; margin: 6px 0; }
  .progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 999px; transition: width .4s ease; }
  .lesson { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .lesson .ico { width: 54px; height: 54px; border-radius: 16px; background: var(--bg-soft); display: flex; align-items: center; justify-content: center; font-size: 28px; flex: none; }
  .lesson .info { flex: 1; min-width: 0; }
  .lesson .name { font-weight: 700; }
  .lesson.locked { opacity: .5; cursor: default; }
  .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 700; white-space: nowrap; }
  .tag.ok { background: var(--ok-soft); color: var(--ok); }
  .tag.go { background: var(--accent-soft); color: var(--accent); }
  .tag.lock { background: #f0f1f5; color: #8b90a3; }
  .resume { background: linear-gradient(135deg, var(--accent), #6a52e0); color: #fff; border: 0; }
  .resume .muted { color: rgba(255,255,255,.85); }
  /* 学習画面 */
  .stepbar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .stepbar .progress { flex: 1; margin: 0; }
  .kind { font-size: 12px; font-weight: 700; color: var(--accent2); letter-spacing: .04em; }
  .prompt { font-size: 18px; font-weight: 700; margin: 4px 0 14px; }
  .flash { perspective: 1000px; height: 300px; cursor: pointer; margin: 6px 0 14px; }
  .flash-inner { position: relative; width: 100%; height: 100%; transition: transform .5s; transform-style: preserve-3d; }
  .flash.flipped .flash-inner { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 22px; border: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fff; padding: 16px; text-align: center; }
  .face.back { transform: rotateY(180deg); background: var(--accent-soft); }
  .emoji-xl { font-size: 92px; line-height: 1.1; }
  .emoji-lg { font-size: 48px; line-height: 1.1; }
  .jp-xl { font-size: 34px; font-weight: 700; margin-top: 8px; }
  .romaji { color: var(--muted); font-size: 15px; }
  .speakbtn { width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; font-size: 28px; cursor: pointer; box-shadow: 0 8px 20px rgba(61,91,217,.3); }
  .speakbtn.big { width: 96px; height: 96px; font-size: 40px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opt { border: 2px solid var(--line); background: #fff; border-radius: 18px; padding: 14px 8px; cursor: pointer; font-family: inherit; font-size: 16px; color: var(--text); text-align: center; transition: transform .08s, border-color .15s, background .15s; min-height: 64px; }
  .opt:active { transform: scale(.97); }
  .opt.pic { font-size: 56px; padding: 10px; min-height: 110px; }
  .opt.correct { border-color: var(--ok); background: var(--ok-soft); }
  .opt.wrong { border-color: var(--ng); background: var(--ng-soft); }
  .opt.sel { border-color: var(--accent); background: var(--accent-soft); }
  .opt.done { opacity: .5; border-color: var(--ok); background: var(--ok-soft); cursor: default; }
  .opt:disabled { cursor: default; }
  .list .opt { width: 100%; margin-bottom: 10px; text-align: left; padding: 14px 16px; }
  .feedback { margin: 12px 0; padding: 12px 14px; border-radius: 14px; font-weight: 700; display: none; }
  .feedback.ok { display: block; background: var(--ok-soft); color: var(--ok); }
  .feedback.ng { display: block; background: var(--ng-soft); color: var(--ng); }
  .footer-next { position: sticky; bottom: 0; background: linear-gradient(180deg, rgba(255,255,255,0), #fff 30%); padding-top: 14px; }
  .matchcols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .matchcols .opt { width: 100%; margin-bottom: 10px; }
  .recctl { display: flex; justify-content: center; gap: 6px; margin: 16px 0 8px; flex-wrap: wrap; }
  .roundbtn { width: 68px; display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; background: transparent; cursor: pointer; font-family: inherit; color: var(--text); font-size: 12px; font-weight: 500; }
  .roundbtn span.c { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; background: var(--accent-soft); color: var(--accent); }
  .roundbtn.rec span.c { background: var(--accent2); color: #fff; }
  .roundbtn.rec.on span.c { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(236,91,122,.5);} 50% { box-shadow: 0 0 0 12px rgba(236,91,122,0);} }
  .roundbtn:disabled { opacity: .35; cursor: default; }
  .note { background: var(--bg-soft); border-radius: 12px; padding: 10px 12px; font-size: 12px; color: var(--muted); margin: 12px 0; }
  .stars { font-size: 44px; letter-spacing: 6px; text-align: center; margin: 10px 0; }
  .wordlist { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .wordlist .opt { min-height: 84px; padding: 8px 4px; font-size: 13px; }
  .wordlist .opt .e { font-size: 30px; display: block; }
  /* 教師画面 */
  .item-edit { border: 1px solid var(--line); border-radius: 14px; padding: 10px; margin-bottom: 10px; background: #fff; }
  .item-edit .r { display: grid; grid-template-columns: 64px 1fr 1fr; gap: 6px; margin-bottom: 6px; }
  .item-edit .r2 { display: grid; grid-template-columns: 1fr; gap: 6px; }
  .item-edit input[type=text] { font-size: 14px; padding: 8px 10px; border-radius: 10px; }
  .item-edit input.emo { text-align: center; font-size: 22px; padding: 4px; }
  .item-edit .acts { display: flex; gap: 6px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
  .toggles label { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .toggles input { width: 20px; height: 20px; accent-color: var(--accent); }
  .tabbar { flex: none; display: flex; border-top: 1px solid var(--line); background: #fff; padding: 6px 4px 18px; }
  .tab { flex: 1; border: 0; background: transparent; font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 700; color: #8b90a3; cursor: pointer; padding: 6px 0; }
  .tab .i { font-size: 22px; filter: grayscale(1); opacity: .7; }
  .tab.on { color: var(--accent); }
  .tab.on .i { filter: none; opacity: 1; }
  .demo-note { flex: none; text-align: center; font-size: 11px; color: var(--muted); padding: 6px 12px; background: var(--bg-soft); border-top: 1px solid var(--line); }
  .toast { position: absolute; left: 50%; top: 96px; transform: translateX(-50%); background: #1f2433; color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 13px; z-index: 60; opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }
  audio { display: none; }
</style>
</head>

let jaVoice = null;
function pickVoice() {

}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let currentAudio = null;
function playItem(item, onend) {
  let ended = false;
  const finish = () => { if (!ended) { ended = true; if (onend) onend(); } };
  if (currentAudio) { try { currentAudio.pause(); } catch (e) {} currentAudio = null; }
  if (item.audio) {   // 教師が録音したお手本があればそれを使う
    const a = new Audio(item.audio); currentAudio = a;
    a.onended = finish; a.onerror = finish;
    a.play().catch(finish);
    setTimeout(finish, 6000);
    return;
  }
  if (!('speechSynthesis' in window)) { setTimeout(finish, 600); return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(item.jp);
    u.lang = 'ja-JP'; u.rate = 0.85; if (jaVoice) u.voice = jaVoice;
    u.onend = finish; u.onerror = finish;
    speechSynthesis.speak(u);
  } catch (e) { finish(); return; }
  setTimeout(finish, 900 + item.jp.length * 350);   // 読み上げ終了が通知されない端末向けの保険
}

// ---------- 録音（MediaRecorder・端末内のみ） ----------
const Rec = {
  mr: null, stream: null, chunks: [], timer: null,
  supported() { return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); },
  async start(onDone, maxMs) {
    if (!this.supported()) throw new Error('unsupported');
    this.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    this.chunks = [];
    this.mr = new MediaRecorder(this.stream);
    this.mr.ondataavailable = e => { if (e.data && e.data.size) this.chunks.push(e.data); };
    this.mr.onstop = () => {
      const blob = new Blob(this.chunks, { type: this.mr.mimeType || 'audio/webm' });
      this.stream.getTracks().forEach(tr => tr.stop());
      this.mr = null; clearTimeout(this.timer);
      onDone(blob);
    };
    this.mr.start();
    this.timer = setTimeout(() => this.stop(), maxMs || 5000);
  },
  stop() { if (this.mr && this.mr.state !== 'inactive') this.mr.stop(); },
  active() { return !!(this.mr && this.mr.state === 'recording'); }
};

// ---------- 問題の自動生成（教材 → ステップ） ----------
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rngOf(seed) { let a = seed; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let r = Math.imul(a ^ a >>> 15, 1 | a); r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r; return ((r ^ r >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, rnd) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function buildSteps(lesson) {
  const items = (lesson.items || []).filter(it => it.jp);
  const acts = lesson.acts || {};
  // 同じ教材なら同じ順番＝途中から再開しても問題が変わらない
  const rnd = rngOf(hashStr(lesson.id + '|' + items.map(i => i.jp).join(',')));
  const idx = items.map((_, i) => i);
  const choices = (target, n) => shuffle([target].concat(shuffle(idx.filter(i => i !== target), rnd).slice(0, n - 1)), rnd);
  const steps = [];
  if (acts.flash && items.length) steps.push({ t: 'flash' });
  if (items.length >= 2) {
    if (acts.listen) shuffle(idx, rnd).slice(0, 3).forEach(i => steps.push({ t: 'listen', a: i, o: choices(i, Math.min(4, items.length)) }));
    if (acts.quiz) shuffle(idx, rnd).slice(0, 3).forEach(i => steps.push({ t: 'quiz', a: i, o: choices(i, Math.min(4, items.length)) }));
    if (acts.match) { const p = shuffle(idx, rnd).slice(0, 4); steps.push({ t: 'match', p, r: shuffle(p, rnd) }); }
  }
  if (acts.speak && items.length) shuffle(idx, rnd).slice(0, 2).forEach(i => steps.push({ t: 'speak', a: i }));
  return { items, steps };
}
const GRADED = { listen: 1, quiz: 1, match: 1 };

function prog() { return S.users[S.user] || (S.users[S.user] = { lessons: {}, last: null, created: Date.now() }); }

function lessonState(i) {

  if (p && p.done) return 'done';
  if (p && p.step > 0) return 'inprog';

}

  if (R.recUrl) { URL.revokeObjectURL(R.recUrl); R.recUrl = null; }

  const rows = S.content.map((l, i) => {
    const n = buildSteps(l).steps.length; const p = prog().lessons[l.id];
    const d = p ? (p.done ? n : Math.min(p.step, n)) : 0;
    const st = lessonState(i);
    return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>' + esc(l.icon || '') + ' ' + esc(lessonTitle(l)) + '</b>'
      + (st === 'done' ? '<span class="tag ok">✓ ' + t('done') + '</span>' : st === 'locked' ? '<span class="tag lock">🔒</span>' : '<span class="tag go">' + t(st === 'inprog' ? 'inprog' : 'newL') + '</span>') + '</div>'
      + '<div class="progress"><i style="width:' + Math.round(d / Math.max(n, 1) * 100) + '%"></i></div>'
      + '<div class="muted">' + t('stepsDone', { d, a: n }) + (p && p.best ? ' ・ ' + t('best', { c: p.best.c, t: p.best.t }) : '') + '</div></div>';
  }).join('');
  return '<h1>' + t('progT') + '</h1><p class="muted">' + t('learner') + '：' + esc(S.user) + '</p>' + rows
    + '<div class="row" style="margin-top:8px"><button class="btn outline" data-act="logout">' + t('logout') + '</button><button class="btn danger" data-act="resetProg">' + t('resetProg') + '</button></div>';
}

// ---------- 教師タブ ----------
function viewTeacher() {
  const list = S.content.map((l, i) => '<div class="card lesson"><div class="ico">' + esc(l.icon || '📘') + '</div><div class="info"><div class="name">' + (i + 1) + '. ' + esc(lessonTitle(l)) + '</div><div class="muted">' + t('words', { n: (l.items || []).length }) + ' ・ ' + buildSteps(l).steps.length + ' steps</div></div><button class="btn ghost sm" data-act="editL" data-i="' + i + '">' + t('edit') + '</button></div>').join('');
  return '<h1>' + t('teachT') + '</h1><p class="muted">' + t('teachSub') + '</p><div style="height:6px"></div>' + list
    + '<button class="btn full" data-act="addL">' + t('addLesson') + '</button>'
    + '<h2>' + t('jsonT') + '</h2><p class="muted">' + t('jsonSub') + '</p>'
    + '<textarea id="jsonBox" rows="7" style="font-family:monospace;font-size:12px"></textarea>'
    + '<div class="row" style="margin-top:8px"><button class="btn ghost sm" data-act="export">' + t('exportB') + '</button><button class="btn sm" data-act="import">' + t('importB') + '</button></div>'
    + '<div style="height:10px"></div><button class="btn danger full sm" data-act="resetContent">' + t('resetB') + '</button>';
}
function viewEdit() {
  const E = S.editing; const l = E.data;
  const items = l.items.map((it, k) => '<div class="item-edit" data-k="' + k + '">'
    + '<div class="r"><input type="text" class="emo" data-f="e" value="' + esc(it.e) + '" aria-label="' + t('fE') + '" maxlength="8"><input type="text" data-f="jp" value="' + esc(it.jp) + '" placeholder="' + t('fJp') + '"><input type="text" data-f="ro" value="' + esc(it.ro) + '" placeholder="' + t('fRo') + '"></div>'
    + '<div class="r2"><input type="text" data-f="mean" value="' + esc(it.mean) + '" placeholder="' + t('fMean') + '"></div>'
    + '<div class="acts"><button class="btn ghost sm" data-act="eSay" data-k="' + k + '">🔊 ' + (it.audio ? t('hasRec') : t('tts')) + '</button>'
    + '<button class="btn sm' + (E.recK === k ? ' pink' : ' outline') + '" data-act="eRec" data-k="' + k + '">🎙 ' + (E.recK === k ? t('stop') : t('recModel')) + '</button>'
    + (it.audio ? '<button class="btn outline sm" data-act="eClr" data-k="' + k + '">' + t('clearModel') + '</button>' : '')
    + '<span style="flex:1"></span><button class="btn danger sm" data-act="eDel" data-k="' + k + '">' + t('del') + '</button></div></div>').join('');
  return '<button class="back" data-act="eBack">← ' + t('cancel') + '</button><h1>' + t('edit') + '：' + esc(lessonTitle(l)) + '</h1>'
    + '<div class="card"><div class="item-edit" style="border:0;padding:0;margin:0"><div class="r"><input type="text" class="emo" id="eIcon" value="' + esc(l.icon) + '" aria-label="' + t('iconL') + '" maxlength="8"><input type="text" id="eTja" value="' + esc(l.title.ja) + '" placeholder="' + t('titleJa') + '"><input type="text" id="eTen" value="' + esc(l.title.en) + '" placeholder="' + t('titleEn') + '"></div></div></div>'
    + '<h2>' + t('items') + '</h2>' + items + '<button class="btn ghost full" data-act="eAdd">' + t('addItem') + '</button>'
    + '<h2>' + t('actsL') + '</h2><div class="card toggles">' + ACT_KEYS.map(a => '<label><input type="checkbox" data-act-key="' + a + '" ' + (l.acts[a] ? 'checked' : '') + '>' + t(ACT_LABEL[a]) + '</label>').join('') + '</div>'
    + '<button class="btn full" data-act="eSave" style="margin-top:6px">' + t('save') + '</button>'
    + (E.i != null ? '<div style="height:10px"></div><button class="btn danger full sm" data-act="eDelL">' + t('delLesson') + '</button>' : '');
}
function readEditForm() {
  const E = S.editing; if (!E) return;
  const sc = $('#screens');
  const ic = $('#eIcon', sc); if (!ic) return;
  E.data.icon = ic.value.trim() || '📘';
  E.data.title.ja = $('#eTja', sc).value.trim(); E.data.title.en = $('#eTen', sc).value.trim();
  sc.querySelectorAll('.item-edit[data-k]').forEach(box => {
    const it = E.data.items[+box.dataset.k]; if (!it) return;
    box.querySelectorAll('input[data-f]').forEach(inp => { it[inp.dataset.f] = inp.value.trim(); });
  });
  sc.querySelectorAll('input[data-act-key]').forEach(cb => { E.data.acts[cb.dataset.actKey] = cb.checked; });
}
function blobToDataUrl(blob) { return new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob); }); }

// ---------- 操作 ----------
function bind(root) { root.querySelectorAll('[data-act]').forEach(el => { el.onclick = ev => { ev.stopPropagation(); act(el.dataset.act, el); }; }); }
async function act(a, el) {
  const R = S.run;
  switch (a) {
    case 'lang': if (S.editing) readEditForm(); S.lang = S.lang === 'ja' ? 'en' : 'ja'; LS.set('ng_lang', S.lang); render(); break;
    case 'login': {
      const n = ($('#nameIn').value || '').trim();
      if (!n) { $('#nameIn').focus(); return; }
      S.user = n; prog(); saveUsers(); S.tab = 'lessons'; render(); break;
    }
    case 'loginAs': S.user = el.dataset.name; saveUsers(); S.tab = 'lessons'; render(); break;
    case 'logout': S.user = null; S.run = null; saveUsers(); render(); break;
    case 'resetProg': S.users[S.user] = { lessons: {}, last: null, created: Date.now() }; saveUsers(); render(); break;
    case 'tab': if (Rec.active()) Rec.stop(); S.tab = el.dataset.tab; S.editing = null; render(); break;
    case 'open': openLesson(+el.dataset.i); break;
    case 'openNext': { const i = R.i + 1; S.run = null; openLesson(i); break; }
    case 'home': S.run = null; S.tab = 'lessons'; render(); break;
    case 'quit': if (Rec.active()) Rec.stop(); if (R && !R.result) toast(t('saved')); S.run = null; render(); break;
    case 'flip': R.flipped = !R.flipped; $('#flash').classList.toggle('flipped', R.flipped); break;
    case 'card': R.card = Math.max(0, Math.min(R.items.length - 1, R.card + (+el.dataset.d))); R.flipped = false; render(); break;
    case 'say': {
      const k = el.dataset.k;
      const it = String(k).startsWith('p') ? allWords()[+k.slice(1)] : (S.run ? S.run.items[+k] : null);
      if (it) { el.classList.add('playing'); playItem(it, () => el.classList.remove('playing')); }
      break;
    }
    case 'ans': {
      if (R.answered) return;
      R.sel = +el.dataset.o; R.answered = true; render(); break;
    }
    case 'next': {
      const st = R.steps[lp(R.lesson.id).step];
      const ok = st.t === 'match' ? R.miss === 0 : (GRADED[st.t] ? R.sel === st.a : false);
      stepDone(ok); break;
    }
    case 'mL': R.sel = +el.dataset.o; render(); break;
    case 'mR': {
      if (R.sel == null) { toast(S.lang === 'ja' ? '先に絵を選んでください' : 'Pick a picture first'); return; }
      const o = +el.dataset.o;
      if (o === R.sel) { R.matched.push(o); R.sel = null; render(); }
      else { R.miss++; el.classList.add('wrong'); setTimeout(() => el.classList.remove('wrong'), 450); }
      break;
    }
    case 'rec': {
      if (Rec.active()) { Rec.stop(); return; }
      const inPractice = !S.run;
      try {
        await Rec.start(blob => {
          const url = URL.createObjectURL(blob);
          if (inPractice) { if (practiceRec) URL.revokeObjectURL(practiceRec); practiceRec = url; }
          else if (S.run) { if (S.run.recUrl) URL.revokeObjectURL(S.run.recUrl); S.run.recUrl = url; }
          render();
        }, 5000);
        render();
      } catch (e) { toast(t('micNg')); }
      break;
    }
    case 'playMine': { const au = $('#mineAudio'); if (au && au.src) { au.currentTime = 0; au.play().catch(() => {}); } break; }
    case 'compare': {
      const k = el.dataset.k;
      const it = String(k).startsWith('p') ? allWords()[+k.slice(1)] : S.run.items[+k];
      playItem(it, () => { const au = $('#mineAudio'); if (au && au.src) { au.currentTime = 0; au.play().catch(() => {}); } });
      break;
    }
    case 'pick': if (Rec.active()) Rec.stop(); practiceSel = +el.dataset.i; if (practiceRec) { URL.revokeObjectURL(practiceRec); practiceRec = null; } render(); break;
    // 教師
    case 'editL': { const i = +el.dataset.i; S.editing = { i, data: JSON.parse(JSON.stringify(S.content[i])), recK: null }; render(); break; }
    case 'addL': S.editing = { i: null, data: { id: 'l' + Date.now().toString(36), icon: '📘', title: { ja: t('newLessonTitle'), en: 'New lesson' }, acts: { flash: true, listen: true, quiz: true, match: true, speak: true }, items: [{ e: '', jp: '', ro: '', mean: '' }, { e: '', jp: '', ro: '', mean: '' }] }, recK: null }; render(); break;
    case 'eBack': if (Rec.active()) Rec.stop(); S.editing = null; render(); break;
    case 'eAdd': readEditForm(); S.editing.data.items.push({ e: '', jp: '', ro: '', mean: '' }); render(); break;
    case 'eDel': readEditForm(); S.editing.data.items.splice(+el.dataset.k, 1); render(); break;
    case 'eSay': readEditForm(); { const it = S.editing.data.items[+el.dataset.k]; if (it && it.jp) playItem(it); } break;
    case 'eClr': readEditForm(); delete S.editing.data.items[+el.dataset.k].audio; render(); break;
    case 'eRec': {
      readEditForm(); const k = +el.dataset.k;
      if (Rec.active()) { Rec.stop(); return; }
      try {
        S.editing.recK = k;
        await Rec.start(async blob => {
          const url = await blobToDataUrl(blob);
          if (S.editing && S.editing.data.items[k]) S.editing.data.items[k].audio = url;
          if (S.editing) S.editing.recK = null;
          render();
        }, 4000);
        toast(t('modelRecording')); render();
      } catch (e) { S.editing.recK = null; toast(t('micNg')); render(); }
      break;
    }
    case 'eSave': {
      readEditForm(); const E = S.editing; const d = E.data;
      d.items = d.items.filter(it => it.jp);
      if (d.items.length < 2) { toast(t('needItems')); render(); return; }
      if (!d.title.ja && !d.title.en) d.title.ja = t('newLessonTitle');
      if (E.i == null) S.content.push(d); else S.content[E.i] = d;
      if (!saveContent()) return;
      S.editing = null; toast(t('savedL')); render(); break;
    }
    case 'eDelL': if (confirm(t('confirmDel'))) { S.content.splice(S.editing.i, 1); saveContent(); S.editing = null; render(); } break;
    case 'export': $('#jsonBox').value = JSON.stringify(S.content.map(l => ({ ...l, items: l.items.map(({ audio, ...rest }) => rest) })), null, 2); break;
    case 'import': {
      try {
        const d = JSON.parse($('#jsonBox').value);
        if (!Array.isArray(d) || !d.every(l => l && l.id && l.title && Array.isArray(l.items))) throw new Error('shape');
        d.forEach(l => { l.acts = l.acts || { flash: true, listen: true, quiz: true, match: true, speak: true }; l.icon = l.icon || '📘'; l.items.forEach(it => { it.e = it.e || '❓'; it.ro = it.ro || ''; it.mean = it.mean || ''; }); });
        S.content = d; saveContent(); toast(t('imported')); render();
      } catch (e) { toast(t('badJson')); }
      break;
    }
    case 'resetContent': if (confirm(t('confirmReset'))) { S.content = JSON.parse(JSON.stringify(SAMPLE)); saveContent(); render(); } break;
  }
}
render();
</script>
</body>
</html>
